services:
  ml-check:
    build: .
    image: ml-check:2026-09-06
    container_name: machine-learning-ml-check
    restart: unless-stopped
    ports:
      - "127.0.0.1:8896:8000"
    read_only: true
    environment:
      ML_CHECK_DB: /data/ml-check.sqlite3
    volumes:
      - ml-check-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 128
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ml-check-data:
