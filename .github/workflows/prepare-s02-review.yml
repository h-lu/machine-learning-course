name: Prepare reviewed S02 sources
on:
  push:
    branches: ["course/s02-focused-review"]
permissions:
  contents: write
jobs:
  apply-reviewed-source:
    if: github.repository == 'h-lu/machine-learning-course' && github.ref == 'refs/heads/course/s02-focused-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require unchanged feature head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git ls-remote origin refs/heads/course/s02-focused-review | cut -f1)" = "$EXPECTED_HEAD"
      - name: Apply only the reviewed source patch
        run: |
          python3 - <<'PY'
          import hashlib
          import lzma
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          parts = [Path(f'.review-transfer/s02-part-{i}.xz') for i in range(4)]
          packed = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(packed).hexdigest() == '293d501868acd027f0345559533d25b230802546b4079bbb4889590d77b13594'
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '2eeb3a347c3ee16753271e2d1a2e22d2fc51b9b850890337d4ed04b73c070aa1'
          allowed = set('''course-instructor/RELEASE.md
          course-instructor/lessons/S02/REFERENCE.md
          course-instructor/lessons/S02/RUNBOOK.md
          course-instructor/lessons/S02/questions.json
          course-instructor/reviews/s02-focused-review-2026-09-20.md
          course-student-template/lesson-04/LEARN.md
          course-student-template/lesson-04/README.md
          course-student-template/lesson-04/SUPPORT.md
          course-student-template/lesson-04/data/DATA.md
          course-student-template/lesson-04/report.md
          course-student-template/mlcourse/foundations.py
          course-student-template/tests/test_foundations.py
          course-student-template/tests/test_s02_review.py
          ml-check/README.md
          ml-check/app/main.py
          ml-check/app/question_bank/lessons.json
          ml-check/app/templates/result.html
          ml-check/deploy/README.md
          ml-check/tests/test_foundation_bank.py
          ml-check/tests/test_intro_bank.py
          ml-check/tests/test_review_readiness.py
          ml-check/tests/test_s02_walkthrough.py
          tools/sync_question_bank.py'''.splitlines())
          stats = subprocess.check_output(['git', 'apply', '--numstat', '-z'], input=patch)
          paths = {x.decode().split('\t', 2)[2] for x in stats.split(b'\0') if x}
          assert paths == allowed, (paths, allowed)
          subprocess.run(['git', 'apply', '--cached', '--check', '--whitespace=error'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--cached', '--whitespace=error'], input=patch, check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed == allowed, changed
          # Check the final source tree without staging removal of this workflow.
          # The repository connector removes transfer files after this source-only commit.
          index = subprocess.check_output(['git', 'rev-parse', '--git-path', 'index'], text=True).strip()
          with tempfile.TemporaryDirectory() as temp:
              alternate = str(Path(temp) / 'index')
              shutil.copyfile(index, alternate)
              env = {**os.environ, 'GIT_INDEX_FILE': alternate}
              removal = [str(p) for p in parts] + ['.github/workflows/prepare-s02-review.yml']
              subprocess.run(['git', 'update-index', '--force-remove', '--', *removal], env=env, check=True)
              tree = subprocess.check_output(['git', 'write-tree'], env=env, text=True).strip()
              assert tree == 'cb0780764bf7e25a93472ae70497a91d282b21e8', tree
          print('Verified 23 reviewed source files; final tree:', tree)
          PY
      - name: Commit source files only on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'course: audit fourth lesson text, practice and concept feedback'
          git push origin HEAD:refs/heads/course/s02-focused-review
