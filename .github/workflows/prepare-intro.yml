# Temporary, branch-scoped transport of locally reviewed source; removed before PR review.
name: Prepare reviewed intro sources
on:
  push:
    branches: ["course/intro-c01-c02"]
    paths:
      - '.github/intro-payload/**'
      - '.github/workflows/prepare-intro.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'h-lu/machine-learning-course' && github.ref == 'refs/heads/course/intro-c01-c02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore only the hash-verified source edits
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          encoded = b''.join(Path(f'.github/intro-payload/part{i}.txt').read_bytes() for i in range(5))
          payload = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(payload).hexdigest() == '31ae324ebeafe251235460aeaa6c2e67d94bef74ec415e58a43cee5f6803916c'
          edits = json.loads(payload)
          assert len(edits) == 46
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          for entry in edits:
              p = Path(entry['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in {'AGENTS.md', 'course-instructor', 'course-student-template', 'machine-learning-course', 'ml-check', 'tools'}
              if entry['old'] is None:
                  assert not p.exists(), str(p)
              else:
                  assert git('hash-object', str(p)) == entry['old'], str(p)
          for entry in edits:
              p = Path(entry['path'])
              if 'patch' in entry:
                  patch = entry['patch'].encode()
                  subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '-'], input=patch, check=True)
                  subprocess.run(['git', 'apply', '--unidiff-zero', '-'], input=patch, check=True)
              else:
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(entry['content'], encoding='utf-8')
              assert git('hash-object', str(p)) == entry['new'], str(p)
          # This author-owned synchronizer reads JSON only; no student commands or web service are run here.
          subprocess.run(['python3', 'tools/sync_question_bank.py'], check=True)
          bank = 'ml-check/app/question_bank/lessons.json'
          assert git('hash-object', bank) == '85e25a7c2f8f7a78d62c054c4f95aad5a02efb40'
          changed = git('diff', '--name-only').splitlines()
          expected = sorted([e['path'] for e in edits] + [bank])
          assert sorted(changed) + sorted(git('ls-files', '--others', '--exclude-standard').splitlines()) == expected or sorted(set(changed) | set(git('ls-files', '--others', '--exclude-standard').splitlines())) == expected
          subprocess.run(['git', 'add', '--', *expected], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'course: complete beginner C01-C02 lessons and common terminology standard'], check=True)
          print('Prepared commit:', git('rev-parse', 'HEAD'))
          PY
      - name: Push only this feature branch, without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/course/intro-c01-c02
