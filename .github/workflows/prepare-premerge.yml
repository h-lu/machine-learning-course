name: Prepare reviewed premerge sources
on:
  push:
    branches: ["course/foundations-s01-s06"]
    paths: [".review-transfer/**", ".github/workflows/prepare-premerge.yml"]
permissions:
  contents: read
jobs:
  apply-reviewed-edits:
    if: github.repository == 'h-lu/machine-learning-course' && github.ref == 'refs/heads/course/foundations-s01-s06'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require unchanged feature head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/course/foundations-s01-s06 | cut -f1)" = "$EXPECTED_HEAD"
          git fetch --depth=2 origin course/foundations-s01-s06
      - name: Apply exact reviewed text and remove transfer files
        run: python3 .review-transfer/apply.py
      - name: Commit only on the existing feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align S07 concept pairs, S06 model provenance and course navigation'
          git push origin HEAD:refs/heads/course/foundations-s01-s06
