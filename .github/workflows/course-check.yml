name: Course checks
on:
  push:
    branches: ["course/intro-c01-c02"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve the exact reviewed source
        run: git archive --format=tar HEAD | gzip > /tmp/course-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: course-source-${{ github.sha }}
          path: /tmp/course-source.tar.gz
          retention-days: 3
      - name: Install test dependencies
        run: python3 -m pip install -r course-student-template/requirements.txt -r ml-check/requirements.txt pytest
      - name: Validate course materials and experiments
        run: python3 tools/validate_course.py
      - name: Validate service tests
        run: PYTHONPATH=ml-check python3 -m pytest -q ml-check/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-validation-${{ github.sha }}
          path: validation/latest.json
          retention-days: 7
