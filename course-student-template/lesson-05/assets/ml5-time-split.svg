<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450"><title>按时间划分：先学习，再选择，最后检查</title><rect width="960" height="450" fill="#f8fafc"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b4d;font-size:20px}.title{font-size:26px;font-weight:700}.small{font-size:17px}.box{stroke:#cbd5e1;stroke-width:2;rx:12}</style><text x="40" y="45" class="title">按时间划分：先学习，再选择，最后检查</text><path d="M50 95H910l-14 -7m14 7l-14 7" fill="none" stroke="#475569" stroke-width="3"/><text x="50" y="85" class="small">较早日期</text><text x="800" y="85" class="small">较晚日期</text><rect class="box" x="40" y="125" width="280" height="170" fill="#dbeafe"/><rect class="box" x="340" y="125" width="280" height="170" fill="#fef3c7"/><rect class="box" x="640" y="125" width="280" height="170" fill="#dcfce7"/><text x="60" y="160" class="">训练集</text><text x="60" y="195" class="">13,003条</text><text x="60" y="232" class="">用标签确定参数</text><text x="60" y="270" class="small">2012-07-01之前</text><text x="360" y="160" class="">验证集</text><text x="360" y="195" class="">2,208条</text><text x="360" y="232" class="">比较候选、选择方案</text><text x="360" y="270" class="small">2012-07-01至09-30</text><text x="660" y="160" class="">最后测试集</text><text x="660" y="195" class="">2,168条</text><text x="660" y="232" class="">方案确定后再评价</text><text x="660" y="270" class="small">2012-10-01起</text><text x="40" y="345" class="">前两段合计15,211条开发记录；前七课不评价最后测试。</text><text x="40" y="385" class="small">图中框宽仅区分阶段，不按记录数量比例绘制。</text></svg>
