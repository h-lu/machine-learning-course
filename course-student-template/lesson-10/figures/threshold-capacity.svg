<text x="35" y="411" fill="#172b4d" font-size="18" font-family="Noto Sans CJK SC, sans-serif" text-anchor="start">容量2时：先找达标者，再按概率从高到低选2条，结果都只选甲、乙。</text>
<text x="35" y="439" fill="#172b4d" font-size="16" font-family="Noto Sans CJK SC, sans-serif" text-anchor="start">“复核”是行动，不等于原有标签，也不等于自动删除。</text></svg>
