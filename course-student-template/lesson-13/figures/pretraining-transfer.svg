<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52647b"/></marker></defs><rect width="1100" height="620" rx="20" fill="#f5f7fb"/><text x="36" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="29" fill="#18334e" font-weight="700">先前学好的表示，接上本课要学的分类器</text><text x="36" y="97" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#18334e" font-weight="700">① 本课之前：模型开发者训练</text><rect x="36" y="120" width="260" height="110" rx="12" fill="#e5ecfb" stroke="#ccd6e2"/><text x="53" y="156" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">外部文本与训练任务</text><text x="53" y="187" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">发生在本课任务之前</text><path d="M308 175 L357 175" stroke="#52647b" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="370" y="120" width="300" height="110" rx="12" fill="#e5ecfb" stroke="#ccd6e2"/><text x="387" y="156" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">调整编码器参数 θ</text><text x="387" y="187" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">得到可复用的模型文件</text><path d="M685 175 L737 175" stroke="#52647b" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="750" y="120" width="310" height="110" rx="12" fill="#d5efea" stroke="#ccd6e2"/><text x="767" y="156" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">已有编码器 gθ</text><text x="767" y="187" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">已完成外部学习</text><text x="36" y="287" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#18334e" font-weight="700">② 本课之中：冻结 θ，只训练短信分类头</text><rect x="36" y="310" width="210" height="110" rx="12" fill="#ffffff" stroke="#ccd6e2"/><text x="53" y="346" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">英文短信 x</text><text x="53" y="377" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">本地执行模型</text><path d="M257 365 L292 365" stroke="#52647b" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="305" y="310" width="230" height="110" rx="12" fill="#d5efea" stroke="#ccd6e2"/><text x="322" y="346" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">编码器 gθ（固定）</text><text x="322" y="377" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">输出向量 h</text><path d="M548 365 L585 365" stroke="#52647b" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="598" y="310" width="230" height="110" rx="12" fill="#fff0d5" stroke="#ccd6e2"/><text x="615" y="346" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">逻辑回归 w、b</text><text x="615" y="377" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">本课训练更新</text><path d="M840 365 L875 365" stroke="#52647b" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="888" y="310" width="172" height="110" rx="12" fill="#ffffff" stroke="#ccd6e2"/><text x="905" y="346" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">垃圾短信概率</text><text x="905" y="377" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">再应用复核规则</text><rect x="598" y="478" width="230" height="72" rx="12" fill="#fff0d5" stroke="#ccd6e2"/><text x="615" y="514" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#18334e" font-weight="400">短信 train 标签</text><path d="M713 468 L713 431" stroke="#52647b" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="36" y="498" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#18334e" font-weight="700">冻结 ≠ 不运行</text><text x="36" y="536" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#18334e" font-weight="400">编码器仍计算，参数不更新。</text><text x="36" y="588" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#18334e" font-weight="400">推理只是计算结果；预训练表示是否有用，仍需在自己的任务中检验。</text></svg>