<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450"><title>同一套预测：先过门槛，再按名额选择</title><rect width="960" height="450" fill="#f8fafc"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b4d;font-size:20px}.title{font-size:26px;font-weight:700}.small{font-size:17px}.box{stroke:#cbd5e1;stroke-width:2;rx:12}</style><text x="40" y="45" class="title">同一套预测：先过门槛，再按名额选择</text><rect class="box" x="40" y="90" width="270" height="170" fill="#dbeafe"/><text x="60" y="128" class="">四条预测</text><text x="60" y="165" class="">a：350　b：340</text><text x="60" y="202" class="">c：200　d：100</text><text x="60" y="240" class="small">实际高需求：a、c</text><text x="325" y="175" class="">→</text><rect class="box" x="360" y="90" width="245" height="170" fill="#fef3c7"/><text x="380" y="128" class="">预测不少于300</text><text x="380" y="170" class="">候选：a、b</text><text x="380" y="211" class="small">按预测从高到低排</text><text x="619" y="175" class="">→</text><rect class="box" x="655" y="90" width="265" height="170" fill="#dcfce7"/><text x="675" y="128" class="">每日容量：1条</text><text x="675" y="170" class="">最终提醒：a</text><text x="675" y="211" class="small">b是候选，但未提醒</text><text x="40" y="315" class="">四格计数用最终名单：TP=1，FP=0，FN=1，TN=2。</text><text x="40" y="355" class="">c虽未通过预测门槛，实际属于高需求，因此是漏报。</text><text x="40" y="395" class="small">本图使用人工小例；实际高需求按实际值不少于300判断。</text></svg>
